<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helen Hermosillo : Drawing Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="intro-screen" class="screen">
    <h1>Drawing Game</h1>
    <button id="start-button">Start</button>
    <button id="settings-button">Settings</button>
    <button id="exit-button">Exit</button>
  </div>
  <div id="settings-screen" class="screen hidden">
    <h2>Settings</h2>
    <label>
      Drawing Timer:
      <input type="number" id="drawing-timer" min="10" max="300" value="60">
    </label>
    <label>
      Guessing Timer:
      <input type="number" id="guessing-timer" min="10" max="300" value="60">
    </label>
    <button id="save-settings">Save</button>
    <button id="back-to-menu">Back</button>
  </div>
  <div id="play-screen" class="screen hidden">
    <h2 id="prompt">Your Prompt: </h2>
    <canvas id="drawing-canvas"></canvas>
    <button id="time-up-button">Time's Up</button>
  </div>
</body>
</html>
